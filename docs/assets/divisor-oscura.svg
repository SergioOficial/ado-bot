<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 30" width="1160" height="30" role="img" aria-label="divisor">
<defs>
<style>
@keyframes vaiven { 0% { transform: translateX(-620px) } 100% { transform: translateX(1500px) } }
@keyframes respirar { 0%,100% { opacity: .45 } 50% { opacity: .8 } }
@keyframes latir { 0%,100% { opacity: .25; transform: scale(1) } 50% { opacity: .7; transform: scale(1.35) } }
@keyframes recorrer { 0% { transform: translateX(-320px) } 100% { transform: translateX(1240px) } }
.brillo { animation: vaiven 11s linear infinite; }
.halo { animation: respirar 9s ease-in-out infinite; }
.punto { animation: latir 5s ease-in-out infinite; transform-origin: center; }
.destello { animation: recorrer 7s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .brillo, .halo, .punto, .destello { animation: none }
}</style>
<linearGradient id="lineaFina" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E2149" stop-opacity="0"/><stop offset=".5" stop-color="#2E2149"/><stop offset="1" stop-color="#2E2149" stop-opacity="0"/></linearGradient>
</defs>
<line x1="0" y1="15" x2="546" y2="15" stroke="url(#lineaFina)" stroke-width="1.4"/>
<line x1="614" y1="15" x2="1160" y2="15" stroke="url(#lineaFina)" stroke-width="1.4"/>
<g transform="translate(580 15)">
  <circle class="punto" r="3.4" fill="#B69CFF"/>
  <rect x="-7" y="-7" width="14" height="14" rx="3" fill="none" stroke="#B69CFF" stroke-width="1.4" opacity=".5" transform="rotate(45)"/>
  <circle cx="-22" cy="0" r="2" fill="#B6A5D6" opacity=".5"/>
  <circle cx="22" cy="0" r="2" fill="#B6A5D6" opacity=".5"/>
</g>
</svg>