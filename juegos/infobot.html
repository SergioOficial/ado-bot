<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; word-break: break-word; }
    .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }
    .item {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .item span { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .item strong { font-size: 14px; color: #38bdf8; }
    .footer { margin-top: 20px; font-size: 11px; color: #64748b; border-top: 1px solid #334155; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🤖</div>
    <h1>{{BOT_NAME}}</h1>
    <p class="subtitle">Información del Sistema</p>
    
    <div class="grid">
      <div class="item">
        <span>Prefijo</span>
        <strong>{{PREFIX}}</strong>
      </div>
      <div class="item">
        <span>Uptime</span>
        <strong>{{UPTIME}}</strong>
      </div>
      <div class="item">
        <span>RAM Usada</span>
        <strong>{{RAM_USADA}}</strong>
      </div>
      <div class="item">
        <span>RAM Total</span>
        <strong>{{RAM_TOTAL}}</strong>
      </div>
      <div class="item">
        <span>Plataforma</span>
        <strong>{{PLATAFORMA}}</strong>
      </div>
      <div class="item">
        <span>Node.js</span>
        <strong>{{NODE_VERSION}}</strong>
      </div>
    </div>

    <div class="footer">
      Generado dinámicamente por {{BOT_NAME}}
    </div>
  </div>
</body>
</html>
