<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ado-Bot | Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050510;
      --card: #0f0f1f;
      --border: #1e1e3a;
      --text: #ffffff;
      --muted: #8b8ba7;
      --neon-cyan: #00ffff;
      --neon-pink: #ff007f;
      --neon-purple: #8b5cf6;
      --gradient: linear-gradient(135deg, #00ffff 0%, #8b5cf6 50%, #ff007f 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 10% 10%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 127, 0.1) 0%, transparent 50%);
      z-index: -1;
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .dashboard {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .dashboard::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: var(--gradient);
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      margin-bottom: 12px;
      background: var(--gradient);
      object-fit: cover;
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .header p {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .item span {
      display: block;
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .item strong {
      display: block;
      font-size: 13px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      word-break: break-word;
    }
    .item strong.pink { color: var(--neon-pink); }
    .item strong.purple { color: var(--neon-purple); }
    .credits {
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 15px;
      font-size: 10px;
      color: var(--muted);
    }
    .credits b { color: #fff; }
    .credits .roxi { color: var(--neon-pink); font-weight: 700; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <img src="{{PFP}}" class="avatar" alt="Bot">
      <h1>{{BOT_NAME}}</h1>
      <p>Sistema en Línea 🟢</p>
    </div>
    
    <div class="grid">
      <div class="item">
        <span>Tipo de Bot</span>
        <strong class="pink">{{TIPO}}</strong>
      </div>
      <div class="item">
        <span>Prefijo</span>
        <strong>{{PREFIX}}</strong>
      </div>
      <div class="item">
        <span>Uptime</span>
        <strong>{{UPTIME}}</strong>
      </div>
      <div class="item">
        <span>Usuarios</span>
        <strong>{{USERS}}</strong>
      </div>
      <div class="item">
        <span>RAM Usada</span>
        <strong class="purple">{{RAM_USADA}}</strong>
      </div>
      <div class="item">
        <span>Plataforma</span>
        <strong style="font-size: 11px;">{{PLATAFORMA}}</strong>
      </div>
    </div>

    <div class="credits">
      Desarrollado por <b>Sergio Dev</b><br>
      Colaborador <span class="roxi">riokuroxi-svg</span>
    </div>
  </div>
</body>
</html>
