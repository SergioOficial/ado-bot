<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AKAME · Piedra, Papel o Tijera</title>
<style>
:root {--fondo:#0b1220;--panel:#111a2c;--linea:#22304d;--texto:#eef3ff;--azul:#4d7cff;--verde:#3ddc97;--rosa:#ff4d8d;--amarillo:#ffd700;}
* {box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body {background-color:var(--fondo); color:var(--texto); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:15px; user-select:none;}
.cab {width:100%; max-width:350px; display:flex; justify-content:space-between; align-items:center; background:var(--panel); padding:12px 15px; border-radius:14px; border:1px solid var(--linea); margin-bottom:30px;}
.cab h1 {font-size:16px; font-weight:800; color:#e8f0ff;}
.marcador {display:flex; justify-content:space-between; width:100%; max-width:350px; margin-bottom:30px; background:var(--panel); padding:15px; border-radius:14px; border:1px solid var(--linea);}
.jugador {text-align:center; flex:1;}
.jugador span {display:block; font-size:10px; color:#7d8dad; font-weight:800; text-transform:uppercase; letter-spacing:1px;}
.jugador b {font-size:24px; color:var(--texto);}
.vs {font-size:14px; font-weight:800; color:#4d7cff; margin-top:10px;}
.arena {display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:30px; min-height:100px;}
.mano {font-size:70px; line-height:1; transition:transform 0.3s;}
.mano.animar {animation:temblor 0.5s infinite;}
@keyframes temblor {0% {transform:translateY(0);} 50% {transform:translateY(-10px);} 100% {transform:translateY(0);}}
.resultado {font-size:20px; font-weight:800; color:var(--amarillo); min-height:30px; margin-bottom:30px; text-align:center;}
.opciones {display:flex; gap:15px; width:100%; max-width:350px; justify-content:center;}
.opcion {flex:1; aspect-ratio:1; background:var(--panel); border:1px solid var(--linea); border-radius:16px; font-size:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s;}
.opcion:hover {background:#1b2740; transform:scale(1.05);}
.opcion:active {transform:scale(0.95);}
.opcion:disabled {opacity:0.5; cursor:not-allowed; transform:none;}
</style>
</head>
<body>
<div class="cab">
  <h1>✊ Piedra, Papel o Tijera</h1>
</div>

<div class="marcador">
  <div class="jugador"><span>Tú</span><b id="puntosJugador">0</b></div>
  <div class="vs">VS</div>
  <div class="jugador"><span>Bot</span><b id="puntosBot">0</b></div>
</div>

<div class="arena">
  <div class="mano" id="manoJugador">❓</div>
  <div class="mano" id="manoBot">❓</div>
</div>

<div class="resultado" id="resultado">Elige tu jugada</div>

<div class="opciones">
  <button class="opcion" onclick="jugar('piedra')">✊</button>
  <button class="opcion" onclick="jugar('papel')">✋</button>
  <button class="opcion" onclick="jugar('tijera')">✌️</button>
</div>

<script>
const emojis = { piedra: '✊', papel: '✋', tijera: '✌️' };
let puntos = { jugador: 0, bot: 0 };
let jugando = false;

const manoJugador = document.getElementById('manoJugador');
const manoBot = document.getElementById('manoBot');
const resultadoEl = document.getElementById('resultado');
const puntosJugadorEl = document.getElementById('puntosJugador');
const puntosBotEl = document.getElementById('puntosBot');
const botones = document.querySelectorAll('.opcion');

function jugar(eleccionJugador) {
  if (jugando) return;
  jugando = true;
  botones.forEach(b => b.disabled = true);
  
  const opciones = ['piedra', 'papel', 'tijera'];
  const eleccionBot = opciones[Math.floor(Math.random() * 3)];

  manoJugador.textContent = emojis[eleccionJugador];
  manoBot.textContent = '❓';
  manoJugador.classList.add('animar');
  manoBot.classList.add('animar');
  resultadoEl.textContent = 'Piedra... Papel... ¡Tijera!';

  setTimeout(() => {
    manoJugador.classList.remove('animar');
    manoBot.classList.remove('animar');
    manoBot.textContent = emojis[eleccionBot];

    determinarGanador(eleccionJugador, eleccionBot);
    jugando = false;
    botones.forEach(b => b.disabled = false);
  }, 1500);
}

function determinarGanador(jugador, bot) {
  if (jugador === bot) {
    resultadoEl.textContent = '¡Empate! 🤝';
    resultadoEl.style.color = 'var(--azul)';
    return;
  }

  const ganaJugador = 
    (jugador === 'piedra' && bot === 'tijera') ||
    (jugador === 'papel' && bot === 'piedra') ||
    (jugador === 'tijera' && bot === 'papel');

  if (ganaJugador) {
    puntos.jugador++;
    puntosJugadorEl.textContent = puntos.jugador;
    resultadoEl.textContent = '¡Ganaste! 🎉';
    resultadoEl.style.color = 'var(--verde)';
  } else {
    puntos.bot++;
    puntosBotEl.textContent = puntos.bot;
    resultadoEl.textContent = 'Perdiste 😢';
    resultadoEl.style.color = 'var(--rosa)';
  }

  // Si alguien llega a 5, reiniciar marcador
  if (puntos.jugador === 5 || puntos.bot === 5) {
    setTimeout(() => {
      alert(puntos.jugador === 5 ? '¡Has ganado la partida! 🏆' : 'El bot ha ganado la partida 🤖');
      puntos = { jugador: 0, bot: 0 };
      puntosJugadorEl.textContent = '0';
      puntosBotEl.textContent = '0';
      manoJugador.textContent = '❓';
      manoBot.textContent = '❓';
      resultadoEl.textContent = 'Elige tu jugada';
      resultadoEl.style.color = 'var(--amarillo)';
    }, 1000);
  }
}
</script>
</body>
</html>
