<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cerito Cruz ·🐱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #fbbf24;
    --gold2: #f59e0b;
    --cyan: #22d3ee;
    --purple: #a855f7;
    --bg-deep: #070b14;
    --bg-card: rgba(15, 23, 42, .85);
    --border-glow: rgba(251, 191, 36, .35);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg-deep) 60%),
      radial-gradient(800px 400px at 100% 100%, rgba(168, 85, 247, .15) 0%, transparent 60%),
      radial-gradient(800px 400px at 0% 100%, rgba(34, 211, 238, .12) 0%, transparent 60%);
    color: #e2e8f0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .juego {
    width: min(100%, 340px);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ═══ BANNER PREMIUM (imagen del gato) ═══ */
  .banner {
    position: relative;
    width: 100%;
    height: 110px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-glow);
    box-shadow:
      0 0 0 1px rgba(251, 191, 36, .15),
      0 10px 30px -10px rgba(251, 191, 36, .4),
      inset 0 0 20px rgba(0, 0, 0, .6);
    flex-shrink: 0;
  }
  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 30%, rgba(7, 11, 20, .85) 100%),
      linear-gradient(90deg, rgba(251, 191, 36, .15), transparent 40%, transparent 60%, rgba(168, 85, 247, .15));
    pointer-events: none;
  }
  .banner-title {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 10px rgba(251, 191, 36, .8),
      0 0 20px rgba(251, 191, 36, .5),
      0 2px 4px rgba(0, 0, 0, .9);
    z-index: 2;
  }
  .banner-badge {
    position: absolute;
    top: 8px;
    right: 10px;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    color: #1a1a1a;
    font-size: .55rem;
    font-weight: 900;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: .5px;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(251, 191, 36, .5);
    z-index: 2;
  }

  /* ═══ MODOS ═══ */
  .modos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .modo {
    padding: 9px 4px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: rgba(15, 23, 42, .85);
    color: #94a3b8;
    font-size: .65rem;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    text-align: center;
    line-height: 1.2;
  }
  .modo:hover { background: #1e293b; color: #e2e8f0; }
  .modo.activo {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-color: transparent;
    color: #1a1a1a;
    box-shadow: 0 0 12px rgba(251, 191, 36, .45);
  }

  /* ═══ MARCADOR ═══ */
  .marcador {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .marcador > div {
    background: var(--bg-card);
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 8px 4px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .marcador > div::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(251, 191, 36, .06), transparent);
    pointer-events: none;
  }
  .marcador .etq {
    display: block;
    font-size: .55rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #64748b;
    margin-bottom: 2px;
  }
  .marcador .num {
    display: block;
    font-size: 1.25rem;
    font-weight: 900;
    line-height: 1;
  }
  .num.x { color: var(--cyan); }
  .num.o { color: #fb7185; }
  .num.e { color: #c4b5fd; }

  /* ═══ ESTADO ═══ */
  #estado {
    text-align: center;
    font-weight: 800;
    font-size: .85rem;
    padding: 8px;
    border-radius: 10px;
    background: rgba(15, 23, 42, .7);
    border: 1px solid #1e293b;
    color: var(--gold);
    transition: color .25s;
  }
  #estado.turno-o { color: #fb7185; }
  #estado.fin { color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, .5); }

  /* ═══ TABLERO PREMIUM ═══ */
  .tablero-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .tablero {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    width: 100%;
    max-width: 340px;
    padding: 8px;
    background: rgba(15, 23, 42, .6);
    border-radius: 20px;
    border: 1px solid var(--border-glow);
    box-shadow:
      0 0 0 1px rgba(251, 191, 36, .1),
      0 20px 50px -20px rgba(0, 0, 0, .9),
      inset 0 0 30px rgba(0, 0, 0, .5);
  }
  .celda {
    border: none;
    border-radius: 14px;
    background: linear-gradient(145deg, #1e293b, #172033);
    color: #e2e8f0;
    font-size: clamp(2rem, 12vw, 3.5rem);
    font-weight: 900;
    font-family: inherit;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .18s, transform .12s, box-shadow .2s;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      inset 0 -2px 0 rgba(0, 0, 0, .3);
    position: relative;
  }
  .celda:hover:not(.ocupada):not(:disabled) {
    background: linear-gradient(145deg, #2b3b52, #1e2a3f);
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .1),
      0 6px 16px -6px rgba(251, 191, 36, .4);
  }
  .celda:active:not(.ocupada):not(:disabled) { transform: scale(.96); }
  .celda:disabled { cursor: default; }
  .celda.x { color: var(--cyan); text-shadow: 0 0 12px rgba(34, 211, 238, .6); }
  .celda.o { color: #fb7185; text-shadow: 0 0 12px rgba(251, 113, 133, .6); }
  .celda.ocupada { animation: pop .22s ease-out; }

  @keyframes pop {
    0%   { transform: scale(.4); opacity: 0; }
    70%  { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }

  .celda.ganadora {
    background: linear-gradient(145deg, #14532d, #166534);
    box-shadow:
      0 0 0 2px #22c55e,
      0 0 25px rgba(34, 197, 94, .7),
      inset 0 0 20px rgba(34, 197, 94, .3);
    animation: pulso .9s ease-in-out infinite alternate;
  }
  @keyframes pulso {
    from { box-shadow: 0 0 0 2px #22c55e, 0 0 12px rgba(34, 197, 94, .4); }
    to   { box-shadow: 0 0 0 2px #22c55e, 0 0 30px rgba(34, 197, 94, .9); }
  }

  /* ═══ ACCIONES ═══ */
  .acciones {
    display: flex;
    gap: 8px;
  }
  .accion {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: rgba(30, 41, 59, .9);
    color: #e2e8f0;
    font-family: inherit;
    font-weight: 700;
    font-size: .8rem;
    cursor: pointer;
    transition: .2s;
  }
  .accion:hover { background: #2b3b52; transform: translateY(-1px); }
  .accion.primario {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-color: transparent;
    color: #1a1a1a;
    box-shadow: 0 0 15px rgba(251, 191, 36, .35);
  }
  .accion.primario:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<main class="juego">
  <!-- Banner premium con la imagen del gato semibot -->
  <div class="banner">
    <img
      src="https://i.postimg.cc/3NFnkKKt/IMG-20261115-WA0024.jpg"
      alt="Gato semibot guardián"
      loading="eager"
    >
    <span class="banner-badge">Premium</span>
    <div class="banner-title">Cerito Cruz</div>
  </div>

  <div class="modos">
    <button class="modo" data-modo="2p">👥 2P</button>
    <button class="modo" data-modo="mancos">🟢 Mancos</button>
    <button class="modo" data-modo="facil">🟡 Fácil</button>
    <button class="modo activo" data-modo="dificil">🔴 Difícil</button>
  </div>

  <div class="marcador">
    <div><span class="etq" id="etqX">Tú (X)</span><span class="num x" id="pX">0</span></div>
    <div><span class="etq">Empates</span><span class="num e" id="pE">0</span></div>
    <div><span class="etq" id="etqO">CPU (O)</span><span class="num o" id="pO">0</span></div>
  </div>

  <p id="estado">Turno de X</p>

  <div class="tablero-wrap">
    <div class="tablero" id="tablero">
      <button class="celda" data-i="0"></button>
      <button class="celda" data-i="1"></button>
      <button class="celda" data-i="2"></button>
      <button class="celda" data-i="3"></button>
      <button class="celda" data-i="4"></button>
      <button class="celda" data-i="5"></button>
      <button class="celda" data-i="6"></button>
      <button class="celda" data-i="7"></button>
      <button class="celda" data-i="8"></button>
    </div>
  </div>

  <div class="acciones">
    <button class="accion primario" id="nueva">Nueva ronda</button>
    <button class="accion" id="reiniciar">Borrar marcador</button>
  </div>
</main>

<script>
'use strict';

/* ══════════════ Lógica principal (sin cambios) ══════════════ */
const COMBINACIONES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const celdas   = [...document.querySelectorAll(".celda")];
const estadoEl = document.getElementById("estado");
const pX       = document.getElementById("pX");
const pO       = document.getElementById("pO");
const pE       = document.getElementById("pE");
const etqX     = document.getElementById("etqX");
const etqO     = document.getElementById("etqO");
const btnsModo = document.querySelectorAll(".modo");

let tablero = Array(9).fill("");
let turno   = "X";
let activo  = true;
let modo    = "dificil";
const puntos = { X: 0, O: 0, empate: 0 };

function iniciarRonda() {
  tablero = Array(9).fill("");
  turno = "X";
  activo = true;
  celdas.forEach(c => {
    c.textContent = "";
    c.className = "celda";
    c.disabled = false;
  });
  actualizarEstado();
}

function actualizarEstado() {
  estadoEl.classList.remove("fin", "turno-o");

  if (modo === "2p") {
    estadoEl.textContent = `Turno de ${turno}`;
  } else if (modo === "mancos") {
    estadoEl.textContent = turno === "X" ? "Tu turno — 🟢 mancos" : "CPU pensando (mancos)…";
  } else if (modo === "facil") {
    estadoEl.textContent = turno === "X" ? "Tu turno — 🟡 fácil" : "CPU pensando (fácil)…";
  } else {
    estadoEl.textContent = turno === "X" ? "Tu turno — 🔴 difícil" : "CPU pensando (difícil)…";
  }

  if (turno === "O") estadoEl.classList.add("turno-o");
}

function nombre(p) {
  if (modo === "2p") return `el jugador ${p}`;
  return p === "X" ? "Tú" : "la CPU";
}

function colocar(i) {
  if (!activo || tablero[i] || i === null || i === undefined) return;
  tablero[i] = turno;
  const celda = celdas[i];
  celda.textContent = turno;
  celda.classList.add("ocupada", turno.toLowerCase());
  celda.disabled = true;

  const res = resultado(tablero);
  if (res) { terminar(res); return; }

  turno = turno === "X" ? "O" : "X";
  actualizarEstado();

  if (modo !== "2p" && turno === "O" && activo) {
    setTimeout(() => {
      const idx = jugadaCPU([...tablero], modo);
      if (idx !== null) colocar(idx);
    }, 380);
  }
}

function resultado(t) {
  for (const [a, b, c] of COMBINACIONES) {
    if (t[a] && t[a] === t[b] && t[a] === t[c]) {
      return { ganador: t[a], linea: [a, b, c] };
    }
  }
  if (t.every(v => v !== "")) return { ganador: "empate", linea: [] };
  return null;
}

function terminar(res) {
  activo = false;
  celdas.forEach(c => c.disabled = true);
  estadoEl.classList.remove("turno-o");
  estadoEl.classList.add("fin");

  if (res.ganador === "empate") {
    puntos.empate++;
    estadoEl.textContent = "¡Empate! 🤝";
    estadoEl.classList.remove("fin");
  } else {
    puntos[res.ganador]++;
    res.linea.forEach(i => celdas[i].classList.add("ganadora"));
    estadoEl.textContent = `¡Ganó ${nombre(res.ganador)}! 🎉`;
  }
  actualizarMarcador();
}

function actualizarMarcador() {
  pX.textContent = puntos.X;
  pO.textContent = puntos.O;
  pE.textContent = puntos.empate;
}

function actualizarEtiquetas() {
  if (modo === "2p") {
    etqX.textContent = "Jugador X";
    etqO.textContent = "Jugador O";
  } else {
    etqX.textContent = "Tú (X)";
    etqO.textContent = "CPU (O)";
  }
}

/* ══════════════ IA por dificultad ══════════════ */
function mejorMovimiento(t) {
  let mejorP = -Infinity, mejorI = null;
  for (let i = 0; i < 9; i++) if (!t[i]) {
    t[i] = "O";
    const p = minimax(t, 0, false);
    t[i] = "";
    if (p > mejorP) { mejorP = p; mejorI = i; }
  }
  return mejorI;
}

function minimax(t, prof, esMax) {
  const r = resultado(t);
  if (r) {
    if (r.ganador === "O") return 10 - prof;
    if (r.ganador === "X") return prof - 10;
    return 0;
  }
  if (esMax) {
    let m = -Infinity;
    for (let i = 0; i < 9; i++) if (!t[i]) {
      t[i] = "O"; m = Math.max(m, minimax(t, prof + 1, false)); t[i] = "";
    }
    return m;
  } else {
    let m = Infinity;
    for (let i = 0; i < 9; i++) if (!t[i]) {
      t[i] = "X"; m = Math.min(m, minimax(t, prof + 1, true)); t[i] = "";
    }
    return m;
  }
}

function libres(t) { return t.map((v, i) => v ? null : i).filter(v => v !== null); }
function aleatorio(t) { const l = libres(t); return l[Math.floor(Math.random() * l.length)] ?? null; }

function jugadaCPU(t, dif) {
  const l = libres(t);
  if (!l.length) return null;
  if (dif === "mancos") return aleatorio(t);
  if (dif === "facil") {
    if (Math.random() < 0.55) return aleatorio(t);
    return mejorMovimiento([...t]);
  }
  return mejorMovimiento([...t]);
}

/* ══════════════ Eventos ══════════════ */
celdas.forEach(celda => {
  celda.addEventListener("click", () => {
    if (!activo) return;
    if (modo !== "2p" && turno === "O") return;
    colocar(Number(celda.dataset.i));
  });
});

btnsModo.forEach(btn => {
  btn.addEventListener("click", () => {
    if (modo === btn.dataset.modo) return;
    modo = btn.dataset.modo;
    btnsModo.forEach(b => b.classList.toggle("activo", b === btn));
    actualizarEtiquetas();
    iniciarRonda();
  });
});

document.getElementById("nueva").addEventListener("click", iniciarRonda);
document.getElementById("reiniciar").addEventListener("click", () => {
  puntos.X = puntos.O = puntos.empate = 0;
  actualizarMarcador();
  iniciarRonda();
});

/* ══════════════ Arranque ══════════════ */
actualizarEtiquetas();
actualizarMarcador();
iniciarRonda();
</script>
</body>
</html>
